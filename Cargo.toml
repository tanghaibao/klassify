[package]
name = "klassify"
description = "Classify chimeric reads based on unique kmer contents"
version = "0.1.7"
edition = "2021"
license = "BSD-2-Clause"
repository = "https://github.com/tanghaibao/klassify"
readme = "README.md"
keywords = ["bioinformatics", "genomics", "kmer", "recombination", "sugarcane"]
categories = ["science::bioinformatics", "command-line-utilities"]
# Without this, cargo also packages untracked working-tree files.
include = ["/src", "/Cargo.toml", "/Cargo.lock", "/README.md", "/LICENSE", "/CITATION.cff"]

[dependencies]
anyhow = "1.0.98"
bincode = "2.0.1"
clap = { version = "4.5", features = ["derive"] }
csv = "1.3"
env_logger = "0.11"
libc = "0.2"
log = "0.4"
needletail = "0.5"
num_cpus = "1.17.0"
perbase = "1.0"
rayon = "1.10"
rust-htslib = "0.39"
serde = { version = "1.0.219", features = ["derive"] }
which = "8.0.0"

[dev-dependencies]
tempfile = "3.20.0"
filetime = "0.2.25"

[[bin]]
name = "klassify"
path = "src/main.rs"
